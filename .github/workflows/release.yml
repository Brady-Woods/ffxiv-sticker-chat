name: Release

# Tag a commit to cut a release:
#   git tag v0.0.0.2 && git push origin v0.0.0.2
#
# Publishes latest.zip as a release asset and points repo.json at it. The download links in repo.json use
# /releases/latest/download/, so they never need to change — only AssemblyVersion and LastUpdate do.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build --configuration Release --nologo

      - name: Read version from built manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content .\FfxivStickerChat\bin\x64\Release\FfxivStickerChat\FfxivStickerChat.json -Raw | ConvertFrom-Json
          "version=$($manifest.AssemblyVersion)" >> $env:GITHUB_OUTPUT
          Write-Host "Built version $($manifest.AssemblyVersion)"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: .\FfxivStickerChat\bin\x64\Release\FfxivStickerChat\latest.zip
          tag_name: ${{ github.ref_name }}
          # Name from the tag, not the assembly version: Dalamud needs a four-part numeric
          # AssemblyVersion, so it cannot carry the -alpha/-beta identifier the tag does.
          name: ${{ github.ref_name }}
          # Any tag with a hyphen is a semver prerelease (v0.1.0-alpha.1); plain v1.2.3 is not.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - name: Update repo.json
        shell: pwsh
        run: |
          $version = "${{ steps.manifest.outputs.version }}"
          $path = "repo.json"
          $repo = Get-Content $path -Raw | ConvertFrom-Json

          # ConvertFrom-Json unwraps a single-element array, so normalise before writing back out.
          # /releases/latest/ resolves to the newest NON-prerelease, so an alpha-only project has no
          # "latest" and that URL 404s. Point at this tag explicitly instead.
          $tag = "${{ github.ref_name }}"
          $asset = "https://github.com/${{ github.repository }}/releases/download/$tag/latest.zip"

          $entries = @($repo)
          foreach ($entry in $entries) {
            $entry.AssemblyVersion = $version
            $entry.TestingAssemblyVersion = $version
            $entry.LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
            $entry.DownloadLinkInstall = $asset
            $entry.DownloadLinkUpdate = $asset
            $entry.DownloadLinkTesting = $asset
          }

          ConvertTo-Json -InputObject $entries -Depth 10 | Set-Content $path -Encoding UTF8

      - name: Commit repo.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if (git diff --staged --quiet) {
            Write-Host "repo.json unchanged."
          } else {
            git commit -m "chore: repo.json -> v${{ steps.manifest.outputs.version }}"
            git push origin HEAD:main
          }
